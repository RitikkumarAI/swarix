name: Swarix CI/CD & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Android App
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Keystores
        run: |
          mkdir -p keystore
          if [ ! -f keystore/my-upload-key.jks ]; then
            keytool -genkey -v -keystore keystore/my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Swarix,O=Swarix,C=US"
          fi
          if [ ! -f keystore/debug.keystore ]; then
            cp keystore/my-upload-key.jks keystore/debug.keystore
          fi
          cp keystore/my-upload-key.jks .
          cp keystore/debug.keystore .

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Swarix.apk || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swarix-APK
          path: dist/Swarix.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: "Swarix Music Player v1.4"
          body: |
            ## 🎵 Swarix Music Player v1.4

            ### ✨ What's New:
            - **New Official Luxury Logo**:
              - Golden luxury acoustic emblem with glowing visualizer as the official app launcher and in-app brand mark.
            - **Lock Screen & Notification Panel Soundtrack**:
              - Complete background media session controls: Play, Pause, Next, and Previous directly from lock screen and notification shade.
            - **Smart Genre & Punjabi Recommendation Shuffle**:
              - Intelligent transition: Playing a Punjabi track now seamlessly shuffles and queues related Punjabi tracks, keeping the vibe consistent.
            - **Complete Singer Catalogue on Search**:
              - Searching an artist now fetches their complete 80+ track library and auto-creates an all-inclusive artist playlist.
            - **Status Bar & Notch Display Fix**:
              - Header elements (Swarix branding, sync, notification bell, profile) perfectly clear and never cut off by system status bar.
            - **Permanent Keystore & Seamless 1-Tap Updates**:
              - Permanent cryptographic signing key ensures future in-app updates install without any package conflict.

            ### 📦 App Details
            - **Package ID**: `com.aistudio.swarix.musply`
            - **Requires**: Android 8.0 (Oreo) and above
            - **Commit**: `${{ github.sha }}`

            ### 📲 Installation Instructions
            1. Download **Swarix.apk** below directly on your Android phone.
            2. Tap the downloaded file to install (enable *"Install unknown apps"* if prompted).
            3. Enjoy high-fidelity, ad-free music listening!
          draft: false
          prerelease: false
          files: |
            dist/Swarix.apk
