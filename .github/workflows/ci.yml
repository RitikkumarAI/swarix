name: Swarix CI/CD & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Android App
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Swarix,O=Swarix,C=US"
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Swarix.apk || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swarix-APK
          path: dist/Swarix.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: "Swarix Music Player v1.3"
          body: |
            ## 🎵 Swarix Music Player v1.3

            ### ✨ What's New:
            - **Spotify-Inspired Home Screen**:
              - Spotify signature 2-column quick access grid of 8 recent tracks/artists.
              - "It's New Music Friday!" and "Jump Back In" horizontal carousels.
              - Popular artists with circular avatars and genre filters (`All`, `Music`, `Podcasts`).
            - **Search with Artist Photos**:
              - Search now displays circular artist photos with dedicated "Artist" tags alongside song results.
              - Spotify-styled "Recents" search history with artwork and quick-save.
            - **Spotify-Inspired "Your Library" Management**:
              - Header matching Spotify with user avatar, search, and playlist creation.
              - Pinned "Liked Songs" card with signature purple-blue gradient.
              - Artists with circular avatars and custom playlists.
            - **Playback Screen Visibility & Dedicated DSP Button**:
              - High-contrast crisp white typography and controls on dark playback backdrop.
              - Dedicated **DSP Sound** button on the playback screen for 1-tap DSP / 10-band Equalizer access.
            - **In-App Auto-Updates (OTA)**: Instant in-app notification and seamless update.

            ### 📦 App Details
            - **Package ID**: `com.aistudio.swarix.musply`
            - **Requires**: Android 8.0 (Oreo) and above
            - **Commit**: `${{ github.sha }}`

            ### 📲 Installation Instructions
            1. Download **Swarix.apk** below directly on your Android phone.
            2. Tap the downloaded file to install (enable *"Install unknown apps"* if prompted).
            3. Enjoy high-fidelity, ad-free music listening!
          draft: false
          prerelease: false
          files: |
            dist/Swarix.apk
