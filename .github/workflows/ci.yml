name: Swarix CI/CD & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Android App
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Swarix,O=Swarix,C=US"
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APKs for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Swarix-Music-Player.apk || true
          cp app/build/outputs/apk/debug/*.apk dist/Swarix-Music-Player-debug.apk || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Swarix-APKs
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: "Swarix Music Player v1.1"
          body: |
            ## 🎵 Swarix Music Player v1.1

            ### ✨ What's New:
            - **Real JioSaavn Streaming Engine**: Unlimited online search & high-fidelity 320kbps audio.
            - **In-App Auto-Updates (OTA)**: Receive future updates directly within the app without opening GitHub!
            - **Authentic Seed Tracks**: Replaced all demo audio with genuine studio master tracks.

            ### 📦 App Details
            - **Package ID**: `com.aistudio.swarix.musply`
            - **Requires**: Android 8.0 (Oreo) and above
            - **Commit**: `${{ github.sha }}`

            ### 📲 Installation Instructions
            1. Download **Swarix-Music-Player.apk** below directly on your Android phone.
            2. Tap the downloaded file to install (enable *"Install unknown apps"* if prompted).
            3. Enjoy high-fidelity, ad-free music listening!
          draft: false
          prerelease: false
          files: |
            dist/Swarix-Music-Player.apk
            dist/Swarix-Music-Player-debug.apk
