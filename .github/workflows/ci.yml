name: Swarix CI/CD & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Android App
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Keystores
        run: |
          mkdir -p keystore
          if [ ! -f keystore/my-upload-key.jks ]; then
            keytool -genkey -v -keystore keystore/my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Swarix,O=Swarix,C=US"
          fi
          if [ ! -f keystore/debug.keystore ]; then
            cp keystore/my-upload-key.jks keystore/debug.keystore
          fi
          cp keystore/my-upload-key.jks .
          cp keystore/debug.keystore .

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1 || {
            grep -E '(e: |ERROR|FAILURE:|Exception)' -A 5 -B 1 build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 build.log
            exit 1
          }

      - name: Upload Build Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-report
          path: |
            app/build/reports/

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y genisoimage p7zip-full || true

      - name: Prepare Multi-Platform Packages for Distribution
        run: python3 scripts/package_multiplatform.py

      - name: Clean Old GitHub Releases & Tags
        run: python3 scripts/delete_old_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RELEASE_TAG: v1.6

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Swarix-MultiPlatform-Packages
          path: |
            dist/swarix.apk
            dist/swarix.dmg
            dist/swarix.exe
            dist/swarix-ios.mobileconfig
            dist/Swarix.apk
            dist/Swarix-for-Mac.zip
            dist/Swarix-for-Windows.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: "Swarix Music Player v1.6 (Official Multi-Platform)"
          body: |
            ## 🎵 Swarix Music Player v1.6 (Official Multi-Platform)

            Developed & Maintained by **[Ritik Kumar](https://ritikkumarai.vercel.app/)**

            ---

            ### 📥 Direct Device Downloads:
            - 📱 **Android**: [**swarix.apk**](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/swarix.apk)
            - 💻 **Mac (macOS)**: [**swarix.dmg**](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/swarix.dmg) *(macOS Disk Image)*
            - 🖥️ **Windows**: [**swarix.exe**](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/swarix.exe) *(Self-extracting Windows installer)*
            - 🍏 **iOS (iPhone / iPad)**: [**swarix-ios.mobileconfig**](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/swarix-ios.mobileconfig) or open [Swarix Web Player](https://ritikkumarai.vercel.app/)
            - 📦 **Mac Bundle**: [Swarix-for-Mac.zip](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/Swarix-for-Mac.zip)
            - 📦 **Windows Bundle**: [Swarix-for-Windows.zip](https://github.com/RitikkumarAI/swarix/releases/download/v1.6/Swarix-for-Windows.zip)

            ---

            ### ✨ What's New in v1.6:
            1. **Official Luxury App Icon**:
               - Embedded official luxury golden S-emblem with acoustic visualizer across all launcher density targets and adaptive icons.
            2. **Direct Device Naming**:
               - Direct download files formatted specifically for each OS: `swarix.apk`, `swarix.dmg`, `swarix.exe`, and `swarix-ios.mobileconfig`.
            3. **Consolidated Single Release**:
               - All obsolete and confusing previous releases completely pruned.
            4. **Scrollable Playback Screen**:
               - AI Sonic match tracks, manual DAC & audio pipeline verification, and Spotify-style blue lyrics card.
            5. **DSP Default Off & Crash Prevention**:
               - Safe foreground service and low-noise default audio path.
          draft: false
          prerelease: false
          files: |
            dist/swarix.apk
            dist/swarix.dmg
            dist/swarix.exe
            dist/swarix-ios.mobileconfig
            dist/Swarix.apk
            dist/Swarix-for-Mac.zip
            dist/Swarix-for-Windows.zip
